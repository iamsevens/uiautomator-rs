name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: uiautomator-linux-x86_64
            cross: false
          
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: uiautomator-linux-aarch64
            cross: true
          
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: uiautomator-macos-x86_64
            cross: false
          
          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: uiautomator-macos-aarch64
            cross: false
          
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: uiautomator-windows-x86_64.exe
            cross: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Download assets (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd uiautomator-cli
          bash assets/download_atx_agent.sh
        shell: bash
      
      - name: Download assets (Windows)
        if: runner.os == 'Windows'
        run: |
          cd uiautomator-cli
          powershell -ExecutionPolicy Bypass -File assets/download_atx_agent.ps1
        shell: pwsh
      
      - name: Build with cross
        if: matrix.cross
        run: |
          cd uiautomator-cli
          cross build --release --target ${{ matrix.target }}
      
      - name: Build
        if: ${{ !matrix.cross }}
        run: |
          cd uiautomator-cli
          cargo build --release --target ${{ matrix.target }}
      
      - name: Prepare binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd uiautomator-cli
          cp target/${{ matrix.target }}/release/uiautomator ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
      
      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd uiautomator-cli
          cp target/${{ matrix.target }}/release/uiautomator.exe ${{ matrix.artifact }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: uiautomator-cli/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure of downloaded files
        run: ls -R artifacts
      
      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              sha256sum "$file" > "$file.sha256"
            done
            cd ..
          done
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/uiautomator-linux-x86_64/uiautomator-linux-x86_64
            artifacts/uiautomator-linux-x86_64/uiautomator-linux-x86_64.sha256
            artifacts/uiautomator-linux-aarch64/uiautomator-linux-aarch64
            artifacts/uiautomator-linux-aarch64/uiautomator-linux-aarch64.sha256
            artifacts/uiautomator-macos-x86_64/uiautomator-macos-x86_64
            artifacts/uiautomator-macos-x86_64/uiautomator-macos-x86_64.sha256
            artifacts/uiautomator-macos-aarch64/uiautomator-macos-aarch64
            artifacts/uiautomator-macos-aarch64/uiautomator-macos-aarch64.sha256
            artifacts/uiautomator-windows-x86_64.exe/uiautomator-windows-x86_64.exe
            artifacts/uiautomator-windows-x86_64.exe/uiautomator-windows-x86_64.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
