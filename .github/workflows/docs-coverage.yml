name: Docs Coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Run docs/examples coverage report
        shell: pwsh
        run: |
          ./scripts/docs-coverage-report.ps1 `
            -FailOnThreshold `
            -MinDocsPercent 99.0 `
            -MinExamplesPercent 55.0

      - name: Show latest summary
        shell: pwsh
        run: |
          Get-Content internal/testlogs/docs/latest-summary.md -Encoding utf8

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-coverage
          path: internal/testlogs/docs/**
          retention-days: 14
