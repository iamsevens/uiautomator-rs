name: Device Regression Matrix

on:
  workflow_dispatch:
    inputs:
      targets_json:
        description: >-
          JSON array of targets. Example:
          [{"name":"arm64_real","serial":"R5CR200B2EN","expected_abi":"arm64-v8a","expected_android_major":14},{"name":"x86_64_emu","serial":"emulator-5554","expected_abi":"x86_64","expected_android_major":9}]
        required: true
        type: string
      step_timeout_minutes:
        description: Timeout (minutes) for each cargo test step inside device-full-test.ps1
        required: false
        default: "45"
        type: string

permissions:
  contents: read

concurrency:
  group: device-regression-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.resolve.outputs.matrix_json }}
      step_timeout_minutes: ${{ steps.resolve.outputs.step_timeout_minutes }}
    steps:
      - name: Resolve targets and validate JSON
        id: resolve
        shell: bash
        env:
          INPUT_TARGETS_JSON: ${{ github.event.inputs.targets_json }}
          INPUT_STEP_TIMEOUT: ${{ github.event.inputs.step_timeout_minutes }}
        run: |
          set -euo pipefail

          targets_json="${INPUT_TARGETS_JSON:-}"
          if [ -z "$targets_json" ]; then
            echo "targets_json is required and must be a non-empty JSON array." >&2
            exit 1
          fi

          python - <<'PY' "$targets_json"
          import json
          import sys

          raw = sys.argv[1]
          try:
              data = json.loads(raw)
          except Exception as exc:
              raise SystemExit(f"invalid targets_json: {exc}")

          if not isinstance(data, list) or len(data) == 0:
              raise SystemExit("targets_json must be a non-empty JSON array")

          for idx, target in enumerate(data):
              if not isinstance(target, dict):
                  raise SystemExit(f"target[{idx}] must be an object")
              for key in ("name", "serial"):
                  if key not in target or not str(target[key]).strip():
                      raise SystemExit(f"target[{idx}] missing required key: {key}")
          PY

          matrix_json=$(python - <<'PY' "$targets_json"
          import json
          import sys

          data = json.loads(sys.argv[1])
          print(json.dumps({"include": data}, separators=(",", ":")))
          PY
          )

          step_timeout="${INPUT_STEP_TIMEOUT:-45}"
          if [ -z "$step_timeout" ]; then
            step_timeout="45"
          fi

          echo "matrix_json=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "step_timeout_minutes=$step_timeout" >> "$GITHUB_OUTPUT"

  regression:
    needs: prepare-targets
    runs-on: [self-hosted, windows]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-targets.outputs.matrix_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure target device online
        shell: pwsh
        env:
          LDPLAYER_START_CMD: ${{ vars.LDPLAYER_START_CMD }}
          MUMU_START_CMD: ${{ vars.MUMU_START_CMD }}
          MUMU_ADB_ENDPOINTS: ${{ vars.MUMU_ADB_ENDPOINTS }}
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\ensure-test-device.ps1 `
            -Serial '${{ matrix.serial }}' `
            -LdplayerStartCommand $env:LDPLAYER_START_CMD `
            -MumuStartCommand $env:MUMU_START_CMD `
            -MumuConnectEndpoints $env:MUMU_ADB_ENDPOINTS `
            -WaitTimeoutSeconds 360

      - name: Run full-device regression for target
        id: run_regression
        continue-on-error: true
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:RUNNER_TEMP ("device-full-manifest-{0}.json" -f '${{ matrix.name }}')
          "MANIFEST_PATH=$manifestPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $args = @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', '.\\scripts\\device-full-test.ps1',
            '-Serial', '${{ matrix.serial }}',
            '-TargetName', '${{ matrix.name }}',
            '-StepTimeoutMinutes', '${{ needs.prepare-targets.outputs.step_timeout_minutes }}',
            '-OutputManifestPath', $manifestPath
          )

          if (-not [string]::IsNullOrWhiteSpace('${{ matrix.expected_abi }}')) {
            $args += @('-ExpectedAbi', '${{ matrix.expected_abi }}')
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ matrix.expected_android_major }}')) {
            $args += @('-ExpectedAndroidMajor', '${{ matrix.expected_android_major }}')
          }

          & powershell @args

      - name: Parse structured summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path $env:MANIFEST_PATH)) {
            throw "manifest not found: $env:MANIFEST_PATH"
          }

          $manifest = Get-Content $env:MANIFEST_PATH -Raw -Encoding utf8 | ConvertFrom-Json
          "RUN_STATUS=$($manifest.status)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUN_LOG_DIR=$($manifest.run_log_dir)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUN_SUMMARY_JSON=$($manifest.summary_json)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUN_SUMMARY_JUNIT=$($manifest.summary_junit)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "target=${{ matrix.name }} serial=${{ matrix.serial }} status=$($manifest.status)"
          Write-Host "log_dir=$($manifest.run_log_dir)"

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-regression-${{ matrix.name }}-${{ matrix.serial }}
          path: |
            ${{ env.MANIFEST_PATH }}
            ${{ env.RUN_SUMMARY_JSON }}
            ${{ env.RUN_SUMMARY_JUNIT }}
            ${{ env.RUN_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce summary status
        if: always()
        shell: pwsh
        run: |
          if ($env:RUN_STATUS -ne 'passed') {
            throw "device regression failed for target=${{ matrix.name }} serial=${{ matrix.serial }}"
          }
