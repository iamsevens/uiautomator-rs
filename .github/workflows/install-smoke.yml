name: Install Smoke

on:
  workflow_dispatch:
    inputs:
      serial:
        description: Android device serial for smoke test
        required: true
        type: string
      target_name:
        description: Optional label for this target
        required: false
        default: install-smoke
        type: string
      step_timeout_minutes:
        description: Timeout (minutes) for each smoke step
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, windows, gui]
    timeout-minutes: 120
    env:
      ANDROID_HOME: ${{ vars.ANDROID_SDK_ROOT }}
      ANDROID_SDK_ROOT: ${{ vars.ANDROID_SDK_ROOT }}
      UIAUTOMATOR_RUST_HOME: ${{ vars.UIAUTOMATOR_RUST_HOME }}
      UIAUTOMATOR_CACHE_DIR: ${{ vars.UIAUTOMATOR_CACHE_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run validation gate (smoke)
        id: run_smoke
        continue-on-error: true
        shell: cmd
        env:
          LDPLAYER_START_CMD: ${{ vars.LDPLAYER_START_CMD }}
          LDPLAYER_STOP_CMD: ${{ vars.LDPLAYER_STOP_CMD }}
          MUMU_START_CMD: ${{ vars.MUMU_START_CMD }}
          MUMU_STOP_CMD: ${{ vars.MUMU_STOP_CMD }}
          MUMU_ADB_ENDPOINTS: ${{ vars.MUMU_ADB_ENDPOINTS }}
        run: |
          set "MANIFEST_PATH=%RUNNER_TEMP%\install-smoke-gate-manifest.json"
          echo MANIFEST_PATH=%MANIFEST_PATH%>>"%GITHUB_ENV%"
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-validation-gate.ps1 -Mode smoke -Serial "${{ inputs.serial }}" -TargetName "${{ inputs.target_name }}" -StepTimeoutMinutes "${{ inputs.step_timeout_minutes }}" -WaitTimeoutSeconds 360 -OutputManifestPath "%MANIFEST_PATH%" -ShutdownTargetOnExit -LdplayerStartCommand "${{ vars.LDPLAYER_START_CMD }}" -LdplayerStopCommand "${{ vars.LDPLAYER_STOP_CMD }}" -MumuStartCommand "${{ vars.MUMU_START_CMD }}" -MumuStopCommand "${{ vars.MUMU_STOP_CMD }}" -MumuConnectEndpoints "${{ vars.MUMU_ADB_ENDPOINTS }}"

      - name: Parse structured summary
        if: always()
        shell: cmd
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\export-manifest-env.ps1 -ManifestPath "%MANIFEST_PATH%" -Serial "${{ inputs.serial }}" -Context "serial=${{ inputs.serial }}" -AllowMissingManifest

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-${{ env.SAFE_SERIAL }}
          path: |
            ${{ env.MANIFEST_PATH }}
            ${{ env.RUN_SUMMARY_JSON }}
            ${{ env.RUN_SUMMARY_JUNIT }}
            ${{ env.RUN_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce summary status
        if: always()
        shell: cmd
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "if ('%RUN_STATUS%' -ne 'passed') { throw 'install smoke failed for serial=${{ inputs.serial }}' }"
