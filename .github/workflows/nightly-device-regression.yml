name: Nightly Device Regression

on:
  workflow_dispatch:
    inputs:
      targets_json:
        description: >-
          Optional JSON array of targets. If empty, use repository variable NIGHTLY_TARGETS_JSON.
        required: false
        default: ""
        type: string
      step_timeout_minutes:
        description: Timeout (minutes) for each cargo test step inside device-full-test.ps1
        required: false
        default: "45"
        type: string
  schedule:
    # 03:30 Asia/Shanghai (UTC+8) every day.
    - cron: "30 19 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-device-regression
  cancel-in-progress: false

jobs:
  prepare-targets:
    runs-on: ubuntu-latest
    outputs:
      targets_json: ${{ steps.resolve.outputs.targets_json }}
      matrix_json: ${{ steps.resolve.outputs.matrix_json }}
      step_timeout_minutes: ${{ steps.resolve.outputs.step_timeout_minutes }}
    steps:
      - name: Resolve targets and validate JSON
        id: resolve
        shell: bash
        env:
          INPUT_TARGETS_JSON: ${{ github.event.inputs.targets_json }}
          VAR_TARGETS_JSON: ${{ vars.NIGHTLY_TARGETS_JSON }}
          INPUT_STEP_TIMEOUT: ${{ github.event.inputs.step_timeout_minutes }}
        run: |
          set -euo pipefail

          targets_json="${INPUT_TARGETS_JSON:-}"
          if [ -z "$targets_json" ]; then
            targets_json="${VAR_TARGETS_JSON:-}"
          fi

          if [ -z "$targets_json" ]; then
            echo "NIGHTLY_TARGETS_JSON is empty. Configure repository variable or pass workflow input." >&2
            exit 1
          fi

          python - <<'PY' "$targets_json"
          import json
          import sys

          raw = sys.argv[1]
          try:
              data = json.loads(raw)
          except Exception as exc:
              raise SystemExit(f"invalid targets_json: {exc}")

          if not isinstance(data, list) or len(data) == 0:
              raise SystemExit("targets_json must be a non-empty JSON array")

          for idx, target in enumerate(data):
              if not isinstance(target, dict):
                  raise SystemExit(f"target[{idx}] must be an object")
              for key in ("name", "serial"):
                  if key not in target or not str(target[key]).strip():
                      raise SystemExit(f"target[{idx}] missing required key: {key}")
          PY

          step_timeout="${INPUT_STEP_TIMEOUT:-45}"
          if [ -z "$step_timeout" ]; then
            step_timeout="45"
          fi

          matrix_json=$(python - <<'PY' "$targets_json"
          import json
          import sys

          data = json.loads(sys.argv[1])
          print(json.dumps({"include": data}, separators=(",", ":")))
          PY
          )

          echo "targets_json=$targets_json" >> "$GITHUB_OUTPUT"
          echo "matrix_json=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "step_timeout_minutes=$step_timeout" >> "$GITHUB_OUTPUT"

  nightly-regression:
    needs: prepare-targets
    runs-on: [self-hosted, windows]
    timeout-minutes: 360
    env:
      ANDROID_HOME: ${{ vars.ANDROID_SDK_ROOT }}
      ANDROID_SDK_ROOT: ${{ vars.ANDROID_SDK_ROOT }}
      UIAUTOMATOR_RUST_HOME: ${{ vars.UIAUTOMATOR_RUST_HOME }}
      UIAUTOMATOR_CACHE_DIR: ${{ vars.UIAUTOMATOR_CACHE_DIR }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare-targets.outputs.matrix_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run validation gate (full)
        id: run_nightly
        continue-on-error: true
        shell: cmd
        env:
          LDPLAYER_START_CMD: ${{ vars.LDPLAYER_START_CMD }}
          LDPLAYER_STOP_CMD: ${{ vars.LDPLAYER_STOP_CMD }}
          MUMU_START_CMD: ${{ vars.MUMU_START_CMD }}
          MUMU_STOP_CMD: ${{ vars.MUMU_STOP_CMD }}
          MUMU_ADB_ENDPOINTS: ${{ vars.MUMU_ADB_ENDPOINTS }}
        run: |
          set "MANIFEST_PATH=%RUNNER_TEMP%\nightly-device-full-gate-manifest-${{ matrix.name }}.json"
          echo MANIFEST_PATH=%MANIFEST_PATH%>>"%GITHUB_ENV%"
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-validation-gate.ps1 -Mode full -Serial "${{ matrix.serial }}" -TargetName "${{ matrix.name }}" -StepTimeoutMinutes "${{ needs.prepare-targets.outputs.step_timeout_minutes }}" -WaitTimeoutSeconds 360 -OutputManifestPath "%MANIFEST_PATH%" -ExpectedAbi "${{ matrix.expected_abi }}" -ExpectedAndroidMajor "${{ matrix.expected_android_major }}" -LdplayerStartCommand "${{ vars.LDPLAYER_START_CMD }}" -LdplayerStopCommand "${{ vars.LDPLAYER_STOP_CMD }}" -MumuStartCommand "${{ vars.MUMU_START_CMD }}" -MumuStopCommand "${{ vars.MUMU_STOP_CMD }}" -MumuConnectEndpoints "${{ vars.MUMU_ADB_ENDPOINTS }}"

      - name: Parse structured summary
        if: always()
        shell: cmd
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\export-manifest-env.ps1 -ManifestPath "%MANIFEST_PATH%" -Serial "${{ matrix.serial }}" -Context "target=${{ matrix.name }} serial=${{ matrix.serial }}" -AllowMissingManifest

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-${{ matrix.name }}-${{ env.SAFE_SERIAL }}
          path: |
            ${{ env.MANIFEST_PATH }}
            ${{ env.RUN_SUMMARY_JSON }}
            ${{ env.RUN_SUMMARY_JUNIT }}
            ${{ env.RUN_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce summary status (allow unavailable device)
        if: always()
        shell: cmd
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\enforce-run-status.ps1 -Context "nightly target=${{ matrix.name }} serial=${{ matrix.serial }}" -AllowFailureCodes "adb_device_unavailable"
